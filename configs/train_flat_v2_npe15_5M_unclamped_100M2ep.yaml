# v2 NPE-15 human-summary-statistics tokenization, ~5M params, K=3 vMF mixture,
# UNCLAMPED softplus + annealed kappa_reg + combined loss.
# 100M-event / 2-epoch scale point (de-risking + trend vs the full 130M/10ep run).
#
# Human-features leg of the encoding comparison. IDENTICAL training/data block to
# the raw-encoding twin (configs/train_flat_v2_none_K84_5M_unclamped_100M2ep.yaml)
# and the SAME combined loss (vmf_angular_weight 0.5) — the only difference between
# the two legs is the input tokenization (npe15 vs flat pulse-concat), so a
# head-to-head isolates the input encoding.
#
# Features reproduce Johann's store byte-for-byte (gate PASS, 180,610 DOM rows);
# see delegation/humanstats_scaled/validation.md. NOTE: t_20 == t_50 == t_first for
# every DOM — a faithfully reproduced reference-generator quirk (percentile runs
# per-pulse). Set data.npe_correct_percentiles: true for genuine quantile times.

model:
  version: v2
  input_mode: linear          # Linear(15, d_model); npe15 tokens are not 4+3K
  input_dim: 15               # NPE-15 summary-statistics token width
  max_pulses_per_dom: 84      # unused by the npe15 collator (kept for schema parity)
  d_model: 256
  max_doms: 128
  num_heads: 8
  num_layers: 6
  hidden_dim: 1024
  head_hidden_dim: 1024
  dropout: 0.1

  head_type: vmf
  vmf_components: 3
  vmf_kappa_min: 1.0
  vmf_kappa_max: 10000.0              # safety net only; see the vMF base config
  vmf_kappa_reg: 1.0e-4               # starting value
  vmf_kappa_reg_final: 0.0            # annealed to zero
  vmf_kappa_reg_anneal_fraction: 0.3  # linear anneal over first 30% of steps
  vmf_angular_weight: 0.5             # combined loss: NLL + λ·angular-distance
                                      # (shared with the raw twin for isolation)

training:
  epochs: 2
  batch_size: 4096
  lr: 3e-4
  warmup_steps: 2000
  weight_decay: 0.01
  gradient_clip: 1.0
  use_amp: true
  amp_dtype: bf16

data:
  tokenization: npe15         # 15-dim summary-statistics DOM tokens
  max_events: 100000000
  val_events: 50000
  num_workers: 8
  geometry_path: /groups/pheno/inar/icecube_kaggle/sensor_geometry_normalized.csv
  train_batches: [1, 650]
  val_batches: [651, 655]
  val_per_epoch: 5

wandb:
  enabled: true
  project: iceaggr
  name: v2-npe15-5M-combined-100M2ep
  tags:
    - flat-transformer-v2
    - npe15
    - humanstats-encoding
    - 5M-params
    - input-linear
    - vmf
    - mixture-3
    - kappa-unclamped
    - kappa-reg-anneal
    - combined-loss
    - scale-100M2ep

checkpoint:
  dir: checkpoints
  save_every: 1
  resume: null
