# T2 preview — HYBRID @ 10M, input_mode NONE (identity concat).
#
# Cheap A4500 preview leg for the green-light decision in
# paper/analysis/hiE_improvement_plan.md T2: does the hybrid token beat humanstats
# on hi-E AND raw on bulk before we spend ~22h on the full T1 base?
#
# PROTOCOL = the enc-control protocol (configs/enc_control_raw_K84_unclamped.yaml):
# 10 epochs x 10M events (~batches 1-50), val = first 50k events of batch 651,
# bs 256, lr 1e-4, d256/L6/H8/ff1024, vMF M=3 softplus unclamped.
# HEAD/LOSS = matched to the full T1 hybrid run (train_flat_v2_hybrid_5M_combined_10ep):
# combined loss (NLL + 0.5*angular) + annealed kappa_reg 1e-4->0.
# NOTE: for a clean encoding comparison the raw@10M and humanstats@10M reference
# legs must use the SAME head/loss (combined + annealed). If those reference legs
# were pure-NLL/fixed-reg, rerun them with this head or the gap is confounded.
#
# input_mode: none is a pure identity — the hybrid token is exactly 256 = d_model.
# Paired with enc_preview_hybrid_linear.yaml (input_mode linear) to test whether a
# learned input mix rebalances the 6%-of-width aggregate stats against the raw dims.

model:
  version: v2
  input_mode: none
  max_pulses_per_dom: 84      # default input_dim = 4 + 3*84 = 256 (= d_model)
  d_model: 256
  max_doms: 128
  num_heads: 8
  num_layers: 6
  hidden_dim: 1024
  head_hidden_dim: 1024
  dropout: 0.1

  head_type: vmf
  vmf_components: 3
  vmf_kappa_min: 1.0
  vmf_kappa_max: 10000.0
  vmf_kappa_reg: 1.0e-4
  vmf_kappa_reg_final: 0.0
  vmf_kappa_reg_anneal_fraction: 0.3
  vmf_angular_weight: 0.5

training:
  epochs: 10
  batch_size: 256
  lr: 1e-4
  warmup_steps: 2000
  weight_decay: 0.01
  gradient_clip: 1.0
  use_amp: true
  amp_dtype: bf16

data:
  tokenization: hybrid
  hybrid_mode: full
  max_events: 10000000
  val_events: 50000
  num_workers: 6
  geometry_path: /groups/pheno/inar/icecube_kaggle/sensor_geometry_normalized.csv
  train_batches: [1, 650]
  val_batches: [651, 655]

wandb:
  enabled: true
  project: iceaggr
  name: enc-preview-hybrid-none
  tags:
    - encoding-comparison-preview
    - hybrid
    - raw-plus-aggregate
    - input-none
    - vmf-K3
    - kappa-unclamped
    - combined-loss

checkpoint:
  dir: checkpoints/enc-preview-hybrid-none
  save_every: 5
  resume: null
