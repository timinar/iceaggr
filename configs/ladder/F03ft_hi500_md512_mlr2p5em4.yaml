model:
  version: v2
  input_mode: linear
  max_pulses_per_dom: 84
  d_model: 256
  max_doms: 512
  num_heads: 8
  num_layers: 24
  hidden_dim: 1024
  head_hidden_dim: 1024
  dropout: 0.1
  head_type: vmf
  vmf_components: 3
  vmf_kappa_min: 1.0
  vmf_kappa_max: 10000.0
  vmf_kappa_reg: 0.0
  vmf_kappa_reg_final: 0.0
  vmf_kappa_reg_anneal_fraction: 0.3
  vmf_angular_weight: 0.5
training:
  optimizer: muon
  muon_lr: 0.00025
  muon_momentum: 0.95
  epochs: 10
  batch_size: 256
  lr: 3.0e-05
  warmup_steps: 500
  weight_decay: 0.01
  gradient_clip: 1.0
  use_amp: true
  amp_dtype: bf16
  seed: 17
  grad_accum_steps: 2
  main_threads: 4
data:
  fast_collate: true
  max_events: 200000000
  val_events: null
  num_workers: 12
  geometry_path: /data/inar/icecube_kaggle/sensor_geometry_normalized.csv
  train_batches:
  - 1
  - 650
  val_batches:
  - 651
  - 651
  val_per_epoch: 1
  train_eval_events: 200000
  min_pulses: 500
wandb:
  enabled: true
  project: iceaggr
  name: F03ft_hi500_md512_mlr2p5em4
  tags:
  - scaling-ladder
  - d256-L24
  - tok-flat
  - base-F03
  - stageD-finetune
  - finetune-hi500
checkpoint:
  dir: checkpoints/ladder
  save_every: 1
  resume: checkpoints/ladder/F03_130M_d256L24lin_s17/best.pt
  finetune: true
_ladder:
  n_params: 19219007
  note: 'F03 hi-E finetune on >=500-pulse events (3x the events of hi1000): does a
    broader bright set help the >=200 slice without costing >=1000? otherwise identical
    to F03ft.'
