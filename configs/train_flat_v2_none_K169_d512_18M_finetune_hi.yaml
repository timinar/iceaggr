# Fine-tune the d512 (K169, ~19M) base on high-activity events (>= 1000 pulses)
#
# Mirrors train_flat_v2_none_K84_5M_finetune_hi.yaml for the d512 base:
# continue from the 10-epoch d512 checkpoint, train only on >=1000-pulse events
# at max_doms=512 (long sequences). lr=2e-5 = 10x below the d512's 2e-4 pretrain
# (same 10x rule the 5M finetune used: 3e-4 -> 3e-5). bs=256 (half the 5M
# finetune's bs512, since d512 doubles d_model -> ~21GB at max_doms512; can be
# raised to 512 if the H100 has headroom).

model:
  version: v2
  input_mode: none
  max_pulses_per_dom: 169
  d_model: 512
  max_doms: 512
  num_heads: 8
  num_layers: 6
  hidden_dim: 2048
  head_hidden_dim: 1024
  dropout: 0.1

training:
  epochs: 10
  batch_size: 256
  lr: 2e-5            # 10x below the d512 pretrain lr (2e-4)
  warmup_steps: 500
  weight_decay: 0.01
  gradient_clip: 1.0
  use_amp: true

data:
  min_pulses: 1000
  max_events: 200000000
  val_events: 50000
  num_workers: 8
  geometry_path: /groups/pheno/inar/icecube_kaggle/sensor_geometry_normalized.csv
  train_batches: [1, 635]
  val_batches: [636, 660]
  val_per_epoch: 5

wandb:
  enabled: true
  project: iceaggr
  name: v2-d512-K169-18M-finetune-hi1000
  tags:
    - flat-transformer-v2
    - d512
    - K169
    - 18M-params
    - finetune
    - high-activity

checkpoint:
  dir: checkpoints
  save_every: 1
  resume: checkpoints/v2-d512-K169-18M-lr2e4-10ep/best.pt
  finetune: true       # load model weights only, fresh optimizer + scheduler
