# Fine-tune K=3 sigmoid vMF (PR #6 parameterization) on high-activity events
# (>= 1000 pulses). Mirrors train_flat_v2_vmf_K3_5M_unclamped_finetune_hi.yaml
# so the two parameterizations are directly comparable on the same recipe.
#
# Starts from the K=3 sigmoid base checkpoint (v2-vmf-K3-5M-sigmoid-anneal-10ep)
# and continues training exclusively on events with >= 1000 pulses.
# kappa_reg held at 0 throughout finetune (already annealed in pretrain).

model:
  version: v2
  input_mode: none
  max_pulses_per_dom: 84
  d_model: 256
  max_doms: 512
  num_heads: 8
  num_layers: 6
  hidden_dim: 1024
  head_hidden_dim: 1024
  dropout: 0.1

  head_type: vmf
  vmf_components: 3
  vmf_kappa_min: 1.0
  vmf_kappa_max: 500.0                # PR #6 default — bounded range
  vmf_kappa_param: sigmoid            # PR #6's bounded-sigmoid map
  vmf_kappa_temperature: 1.0          # PR #6 default
  vmf_kappa_reg: 0.0                  # anneal already finished in pretrain

training:
  epochs: 10
  batch_size: 512
  lr: 3e-5
  warmup_steps: 500
  weight_decay: 0.01
  gradient_clip: 1.0
  use_amp: true
  amp_dtype: bf16            # match base; sigmoid κ ≤ 500 doesn't need fp32
                             # range, but keeping bf16 makes the comparison
                             # apples-to-apples with the unclamped finetune.

data:
  min_pulses: 1000
  max_events: 200000000
  val_events: 50000
  num_workers: 8
  geometry_path: /groups/pheno/inar/icecube_kaggle/sensor_geometry_normalized.csv
  train_batches: [1, 635]
  val_batches: [636, 660]
  val_per_epoch: 5

wandb:
  enabled: true
  project: iceaggr
  name: v2-vmf-K3-5M-sigmoid-finetune-hi1000
  tags:
    - flat-transformer-v2
    - K84
    - 5M-params
    - vmf
    - mixture-3
    - kappa-sigmoid
    - finetune
    - high-activity
    - pr6-comparison

checkpoint:
  dir: checkpoints
  save_every: 1
  resume: checkpoints/v2-vmf-K3-5M-sigmoid-anneal-10ep/best.pt
  finetune: true            # load model weights only, fresh optimizer+scheduler
