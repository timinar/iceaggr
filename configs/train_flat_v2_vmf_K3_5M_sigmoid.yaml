# v2 none K=84 ~5M params, K=3 vMF mixture with the SIGMOID κ-parameterization
# from PR #6 (commit 5a87d4f on main).
#
# κ = κ_min + (κ_max - κ_min) · σ(raw_kappa / T)
#
# Trained from scratch as an empirical comparison to our unclamped softplus
# K=3 base (configs/train_flat_v2_vmf_K3_5M_unclamped.yaml). PR #6's defaults:
# κ_min=1, κ_max=500, T=1. With the head's zero-init bias, κ_init = 250.5 —
# the network starts overconfident in random directions, and has to fight its
# way down. Init NLL ≈ 156 (vs ~2.7 for softplus init).
#
# kappa_reg anneal (1e-4 → 0 over first 30%) is kept for stability during
# this fight-down phase.
#
# What we'll learn:
#   - Does it train at all from this init? (smoke check)
#   - Final NLL/angular error vs unclamped softplus K=3
#   - κ tail behavior — sigmoid bounds κ ≤ 500 by construction, so no
#     plateau-removal in the κ-vs-N_pulses sense; the question is whether
#     the trained model uses the available range well.

model:
  version: v2
  input_mode: none
  max_pulses_per_dom: 84
  d_model: 256
  max_doms: 128
  num_heads: 8
  num_layers: 6
  hidden_dim: 1024
  head_hidden_dim: 1024
  dropout: 0.1

  head_type: vmf
  vmf_components: 3
  vmf_kappa_min: 1.0
  vmf_kappa_max: 500.0                # PR #6 default
  vmf_kappa_param: sigmoid            # opt into PR #6's bounded-sigmoid map
  vmf_kappa_temperature: 1.0          # PR #6 default
  vmf_kappa_reg: 1.0e-4               # anneal start
  vmf_kappa_reg_final: 0.0
  vmf_kappa_reg_anneal_fraction: 0.3

training:
  epochs: 10
  batch_size: 4096
  lr: 3e-4
  warmup_steps: 2000
  weight_decay: 0.01
  gradient_clip: 1.0
  use_amp: true
  amp_dtype: bf16            # bf16 for fp32-range; sigmoid κ ≤ 500 wouldn't
                             # need it, but matching the K=3 unclamped recipe
                             # keeps the comparison apples-to-apples.

data:
  max_events: 200000000
  val_events: 100000
  num_workers: 8
  geometry_path: /groups/pheno/inar/icecube_kaggle/sensor_geometry_normalized.csv
  train_batches: [1, 650]
  val_batches: [651, 655]
  val_per_epoch: 5

wandb:
  enabled: true
  project: iceaggr
  name: v2-vmf-K3-5M-sigmoid-anneal-10ep
  tags:
    - flat-transformer-v2
    - K84
    - 5M-params
    - input-none
    - vmf
    - mixture-3
    - kappa-sigmoid
    - kappa-reg-anneal
    - pr6-comparison

checkpoint:
  dir: checkpoints
  save_every: 1
  resume: null
